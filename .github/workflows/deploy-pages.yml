name: Deploy main to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write        # push to gh-pages
  pull-requests: read    # dashboard lists open PRs

# Serialize every write to the gh-pages branch across BOTH workflows so
# concurrent runs never race on the push.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish main
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/specbuild/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r tools/specbuild/requirements.txt

      - name: Install Node dependencies
        run: cd tools/specbuild && npm install --registry https://registry.npmjs.org

      - name: Install WeasyPrint system libraries
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Build specification
        run: |
          python tools/specbuild/compile.py \
            --profile publication \
            --no-pwa \
            --toc-leaders table \
            --check-sdl-syntax \
            --links

      - name: Publish to gh-pages
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/publish.sh main
