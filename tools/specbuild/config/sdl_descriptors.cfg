# SDL Descriptor Configuration
#
# This file defines the descriptors recognized by the SDL syntax-to-table
# converter. Lines starting with '#' are comments. Blank lines are ignored.
#
# There are two sections:
#
#   [functions]   - Descriptors that take parenthesized arguments.
#                   Example: f(1), range(420, 620), le(16)
#
#   [keywords]    - Bare keyword descriptors (no parentheses).
#                   Matching is case-insensitive.
#                   Example: derived, REQUIRED, reserved
#
# Add or remove entries to match your specification's syntax.

[functions]
# AV2 / video codec descriptors
f
uvlc
svlc
le
leb128
su
ns
rg
tu
L
S
NS

# Range descriptor (bicycle / general use)
range

[keywords]
derived
required
optional
computed
reserved
