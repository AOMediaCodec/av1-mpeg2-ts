[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specbuild"
version = "0.3.21"
description = "A reusable pipeline for building Bikeshed specifications"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["bikeshed", "specifications", "documentation", "pdf", "html", "standards"]
authors = [
    { name = "Alexis Michael Tourapis" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "beautifulsoup4>=4.12",
    "bikeshed>=5.0",
    "html5lib>=1.1",
    "latex2mathml>=3.22",
    "lxml>=5.0",
    "Pygments>=2.17",
    "requests>=2.31",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=69.0",
    "pypdf>=4.0",
    "pillow>=10.0",
]
docx = [
    "python-docx>=1.2.0",
]
slides = [
    "python-pptx>=1.0.2",
]
ballot = [
    "openpyxl>=3.1.5",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
dev = [
    "specbuild[pdf,docx,test]",
    "ruff>=0.15.15",
]

[project.scripts]
specbuild = "specbuild.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["specbuild*"]

[tool.setuptools.package-data]
"specbuild" = [
    "scripts/*.py",
    "standards/boilerplate/**/*",
    "config/*",
    "css/**/*",
    "js/**/*",
    "schema/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
